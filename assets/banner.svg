<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#101830"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow1)"/>
  <rect width="1200" height="360" fill="url(#glow2)"/>

  <!-- Decorative grid lines -->
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#1f6feb" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="160" x2="1200" y2="160" stroke="#1f6feb" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="240" x2="1200" y2="240" stroke="#1f6feb" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="320" x2="1200" y2="320" stroke="#1f6feb" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Vertical grid lines -->
  <line x1="200" y1="0" x2="200" y2="360" stroke="#1f6feb" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="360" stroke="#1f6feb" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="360" stroke="#1f6feb" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="360" stroke="#1f6feb" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="1000" y1="0" x2="1000" y2="360" stroke="#1f6feb" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="60" r="2" fill="#58a6ff" opacity="0.3"/>
  <circle cx="1100" cy="80" r="3" fill="#58a6ff" opacity="0.2"/>
  <circle cx="150" cy="300" r="2" fill="#58a6ff" opacity="0.25"/>
  <circle cx="1050" cy="280" r="2" fill="#58a6ff" opacity="0.3"/>
  <circle cx="80" cy="180" r="1.5" fill="#58a6ff" opacity="0.2"/>
  <circle cx="1120" cy="200" r="1.5" fill="#58a6ff" opacity="0.2"/>

  <!-- Decorative pulse lines (like live data flow) -->
  <polyline points="0,140 50,138 100,142 150,136 200,144 250,140 300,135 350,143 400,138 450,141 500,137 550,145 600,139 650,142 700,136 750,144 800,140 850,138 900,143 950,137 1000,141 1050,139 1100,145 1150,140 1200,142" fill="none" stroke="#58a6ff" stroke-opacity="0.08" stroke-width="1.5"/>
  <polyline points="0,220 60,218 120,222 180,217 240,224 300,219 360,223 420,216 480,221 540,225 600,218 660,222 720,217 780,224 840,220 900,219 960,223 1020,217 1080,222 1140,218 1200,221" fill="none" stroke="#58a6ff" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- Data dots on pulse line -->
  <circle cx="300" cy="135" r="2.5" fill="#58a6ff" opacity="0.15"/>
  <circle cx="600" cy="139" r="2.5" fill="#58a6ff" opacity="0.15"/>
  <circle cx="900" cy="143" r="2.5" fill="#58a6ff" opacity="0.15"/>
  <circle cx="300" cy="219" r="2" fill="#58a6ff" opacity="0.12"/>
  <circle cx="720" cy="217" r="2" fill="#58a6ff" opacity="0.12"/>

  <!-- Accent line above headline -->
  <rect x="420" y="118" width="360" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>

  <!-- Headline -->
  <text x="600" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="58.0" font-weight="700" fill="#ffffff">
    <tspan x="600" dy="0">Grok 4 Real Time Bypass</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" font-weight="400" fill="#c9d1d9">
    <tspan x="600" dy="0" font-size="17.1">Grok 4 Real-Time Bypass Tool companion for developers testing rate limits — stream live token flow and adjust…</tspan>
  </text>

  <!-- Bottom accent line -->
  <rect x="480" y="270" width="240" height="1.5" rx="0.75" fill="url(#accent)" opacity="0.3"/>
</svg>